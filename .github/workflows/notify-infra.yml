name: Notify sub2api-infra

# On every merge/push to main, tell the sub2api-infra repo to build and
# publish a fresh image to GHCR. The VM's watchtower then auto-deploys it.
# See: sub2api-infra/docs/sub2api-repo-dispatch-workflow.md
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: notify-infra
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sub2api-infra image build
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.INFRA_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/shudonglin/sub2api-infra/dispatches \
            -d '{"event_type":"sub2api-main-merged","client_payload":{"source_sha":"${{ github.sha }}"}}'
