name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.2'
      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        working-directory: frontend
        run: |
          pnpm audit --prod --audit-level=high --json > audit.json || true
      - name: Check audit exceptions
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml

  # gitleaks CLI direct (no GitHub API calls). gitleaks-action@v2 needed
  # GHAS / pull-requests:write to post review comments + upload SARIF;
  # neither is available on a private repo without GHAS, so we run the
  # binary and fail the job on findings.
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSLf -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        run: |
          gitleaks detect --source . --redact --verbose --no-banner --exit-code 1
      - name: Fail if a real .env file is tracked
        run: |
          # Any *.example env template is allowed; any other .env is a leak.
          tracked=$(git ls-files | grep -E '\.env(\.|$)' | grep -vE '\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Tracked .env file(s) detected — remove from git: $tracked"
            exit 1
          fi
          echo "No tracked .env files — OK"

  # Go SAST (gosec) — replaces the Go portion of CodeQL on private repos
  # without GHAS. Runs locally, fails on findings, no SARIF upload.
  go-sast:
    name: Go SAST (gosec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Install gosec
        env:
          # Pre-built binary avoids `go install`-from-source compile failures
          # under newer Go toolchains pulling stale golang.org/x/tools.
          GOSEC_VERSION: 2.21.4
        run: |
          curl -sSLf -o /tmp/gosec.tar.gz \
            "https://github.com/securego/gosec/releases/download/v${GOSEC_VERSION}/gosec_${GOSEC_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/gosec.tar.gz -C /usr/local/bin gosec
          gosec --version
      - name: Run gosec
        working-directory: backend
        run: |
          # Severity HIGH + confidence HIGH = strictest filter, gosec's
          # equivalent of semgrep --severity ERROR. Drops audit-level
          # noise (G115 overflow, G404 math/rand, G201/G202 SQL string
          # ops, G304 path traversal hints, G301/G302/G306 file perms)
          # which are pre-existing tech debt requiring per-call review.
          #
          # G407 (hardcoded IV/nonce) excluded due to a known gosec FP
          # at backend/internal/repository/aes_encryptor.go:98 — the
          # nonce arg there is dynamically extracted from the ciphertext
          # prefix (line 95: `nonce, _ := data[:nonceSize], ...`), not
          # hardcoded. gosec's pattern matcher misreads it.
          gosec -severity high -confidence high -exclude=G407 -exclude-dir=vendor ./...

  # Multi-language SAST (Semgrep) — replaces the JS/TS portion of CodeQL.
  # Uses public rule packs; no Semgrep AppSec account or token needed.
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.95.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Run Semgrep
        run: |
          # --severity ERROR filters to high-severity rules only, blocking
          # real RCE/injection/auth-bypass classes while skipping audit-level
          # warnings (math/rand suggestion, decompression-bomb hint on
          # already-bounded readers, "consider parameterized SQL" on calls
          # that can't bind parameters, etc.) which require per-call review
          # and shouldn't gate every PR.
          # Exclusions cover known false positives at any severity.
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/secrets \
            --severity ERROR \
            --exclude-rule generic.secrets.security.detected-google-gcm-service-account.detected-google-gcm-service-account \
            --exclude-rule dockerfile.security.missing-user-entrypoint.missing-user-entrypoint \
            --exclude-rule dockerfile.security.missing-user.missing-user \
            --error \
            --metrics=off

  # Container image CVE scan (Trivy) — scans the final Alpine image for
  # OS-package and bundled-library vulnerabilities, which govulncheck
  # (Go modules) and pnpm audit (npm) do not cover. --ignore-unfixed
  # gates only on CVEs that have an available fix, so the job stays
  # actionable. CLI binary, no token / GitHub API needed.
  container-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Build container image
        run: docker build -t sub2api:scan -f Dockerfile .
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.58.1
        run: |
          curl -sSLf -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy --version
      - name: Scan image for OS + library CVEs
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            --scanners vuln \
            sub2api:scan
