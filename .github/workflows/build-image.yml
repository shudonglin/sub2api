name: Build & publish image

# On every merge to main, build the container image and push it to GHCR as
# :latest. The Oracle VM (sub2api-infra) runs watchtower, which tracks :latest
# and redeploys automatically. Tagged releases (release.yml) publish versioned
# tags only — they intentionally no longer push GHCR :latest, so :latest
# always means "newest main".
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image refs
        id: img
        run: |
          set -euo pipefail
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "image=ghcr.io/${OWNER}/sub2api"
            echo "sha=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Must match the deploy VM's CPU arch. The Oracle VM is currently
          # VM.Standard.E2.1.Micro (AMD x86_64).
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:latest
            ${{ steps.img.outputs.image }}:main-${{ steps.img.outputs.sha }}

      - name: Summary
        run: |
          echo "Pushed ${{ steps.img.outputs.image }}:latest and :main-${{ steps.img.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
